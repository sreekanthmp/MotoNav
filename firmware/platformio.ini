;     -DMOTONAV_OLED_HEIGHT=<64 or 32>
;     -DMOTONAV_OLED_I2C_ADDR=<0x3C or 0x3D, as printed by the boot-time I2C scan>
;     -DMOTONAV_I2C_SDA=<gpio>
;     -DMOTONAV_I2C_SCL=<gpio>
