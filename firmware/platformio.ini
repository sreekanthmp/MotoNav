; MotoNav firmware - Phase 1 (simulated navigation on the display, no BLE).
;
; THE BOARD AND DISPLAY ARE NOT IDENTIFIED YET (see ../HARDWARE.md).
; There is therefore no default environment, and src/display_config.h refuses
; to build until the display settings are given. Nothing below is a claim
; about your hardware.
;
; To flash your own board, copy the commented template at the bottom, fill in
; the values you have verified, and run:   pio run -e myboard -t upload

[platformio]
; Intentionally empty: do not build for hardware nobody has identified.

[env]
framework = arduino
monitor_speed = 115200
; Versions are pinned to what the Phase 1 compile check resolved (2026-11-08).
; Change them deliberately, then rebuild and re-test.
lib_deps =
    adafruit/Adafruit GFX Library@1.13.0
    adafruit/Adafruit SSD1306@2.5.17
    adafruit/Adafruit BusIO@1.17.4
build_flags =
    -Wall
    -Wextra

; ---------------------------------------------------------------------------
; COMPILE CHECKS ONLY. They prove the device-side code builds for generic
; targets of three common ESP32 variants, since the real board is not
; identified. The boards and every number below are PLACEHOLDERS so the code
; compiles. Do NOT flash these and expect them to match your wiring; GPIO 21/22
; do not even exist on every variant.
;   pio run                      builds all three
;   pio run -e compile_check_esp32s3   builds one
; ---------------------------------------------------------------------------
[compile_check]
build_flags =
    ${env.build_flags}
    -DMOTONAV_OLED_WIDTH=128
    -DMOTONAV_OLED_HEIGHT=64
    -DMOTONAV_OLED_I2C_ADDR=0x3C
    -DMOTONAV_I2C_SDA=21
    -DMOTONAV_I2C_SCL=22

[env:compile_check_esp32dev]
platform = espressif32@8.0.0
board = esp32dev
build_flags = ${compile_check.build_flags}

[env:compile_check_esp32s3]
platform = espressif32@8.0.0
board = esp32-s3-devkitc-1
build_flags = ${compile_check.build_flags}

[env:compile_check_esp32c3]
platform = espressif32@8.0.0
board = esp32-c3-devkitm-1
build_flags = ${compile_check.build_flags}

; ---------------------------------------------------------------------------
; TEMPLATE for the real board. Uncomment and fill in after identification.
; ---------------------------------------------------------------------------
; [env:myboard]
; platform = espressif32@8.0.0
; board = <PlatformIO board id for your exact board>
; build_flags =
