; MotoNav firmware. Phase 1 (simulated navigation, no BLE) and Phase 2 (BLE) are separate environments.
;
; HARDWARE: a classic ESP32, 30-pin "NodeMCU"-style DevKit with a CP2102 USB
; chip, and a 0.96 inch 128x64 four-pin I2C OLED. PROVISIONAL: these facts come
; from product listings and have NOT been verified on the physical parts. See
; ../HARDWARE.md ("Verifying the hardware") before trusting them.
;
; Environments
;   motonav      the Phase 1 firmware: simulated navigation, no Bluetooth (this is the default).
;                The Phase 1 hardware validation (T1-T6) tests THIS environment.
;   motonav_ble  the Phase 2 firmware: the same display, with navigation messages received over
;                Bluetooth LE. A separate environment so that motonav stays exactly as validated.
;   hw_check     diagnostic: chip, board and I2C checks
;   oled_check   diagnostic: test patterns that tell SSD1306 from SH1106
;
; Usual order on a new board:
;   pio run -e hw_check   -t upload && pio device monitor
;   pio run -e oled_check -t upload && pio device monitor
;   pio run -e motonav    -t upload && pio device monitor

[platformio]
default_envs = motonav

[env]
framework = arduino
monitor_speed = 115200
monitor_filters = default, esp32_exception_decoder
; Versions are pinned to what the Phase 1 compile check resolved (2026-11-08).
; Change them deliberately, then rebuild and re-test.
lib_deps =
    adafruit/Adafruit GFX Library@1.13.0
    adafruit/Adafruit SSD1306@2.5.17
    adafruit/Adafruit BusIO@1.17.4
build_flags =
    -Wall
    -Wextra

; Settings shared by all three environments.
;
; board: PlatformIO has no board named "NodeMCU 30-pin". The common 30-pin boards
; use the DOIT "ESP32 DevKit V1" layout, which is esp32doit-devkit-v1: chip
; esp32 (classic), 4 MB flash, and its Arduino variant defines the default I2C
; pins as SDA=21, SCL=22.
;
; Display flags, all PROVISIONAL until verified (see HARDWARE.md):
;   WIDTH/HEIGHT  from the product listing
;   I2C_ADDR      0x3C is the usual address, but 0x3D also occurs. Run hw_check
;                 and change this line if it reports a different address.
;   SDA/SCL       the proposed wiring (GPIO21 and GPIO22)
[esp32_nodemcu]
platform = espressif32@8.0.0
board = esp32doit-devkit-v1
build_flags =
    ${env.build_flags}
    -DMOTONAV_OLED_WIDTH=128
    -DMOTONAV_OLED_HEIGHT=64
    -DMOTONAV_OLED_I2C_ADDR=0x3C
    -DMOTONAV_I2C_SDA=21
    -DMOTONAV_I2C_SCL=22

[env:motonav]
extends = esp32_nodemcu
build_src_filter =
    +<*>
    -<tools/>
    -<main_ble.cpp>
    -<ble_link.cpp>

; Phase 2. NimBLE-Arduino is pinned to the version that was compile-checked on this framework.
; One connection at a time: two phones writing navigation data would fight over the display.
[env:motonav_ble]
extends = esp32_nodemcu
lib_deps =
    ${env.lib_deps}
    h2zero/NimBLE-Arduino@2.5.2
build_flags =
    ${esp32_nodemcu.build_flags}
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
build_src_filter =
    +<*>
    -<tools/>
    -<main.cpp>

[env:hw_check]
extends = esp32_nodemcu
build_src_filter =
    -<*>
    +<tools/hw_check.cpp>

[env:oled_check]
extends = esp32_nodemcu
build_src_filter =
    -<*>
    +<tools/oled_check.cpp>
