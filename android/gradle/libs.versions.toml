# Versions are pinned to what the Phase 3 build was checked with (2026-11-08).
# Change them deliberately, then rebuild and re-test.
#
# agp     Android Gradle Plugin 9.5.1. Chosen because it supports API level 37, which the
#         Navigation SDK needs (Phase 4), and because it declares its own Kotlin: AGP 9 has
#         built-in Kotlin, so the app module does not apply a Kotlin plugin.
#         Requires Gradle 9.6.0 (see gradle/wrapper), JDK 17 or newer, Build Tools 36.0.0.
# kotlin  2.2.10: exactly the Kotlin Gradle plugin that AGP 9.5.1 depends on (read from its POM),
#         used for the two pure-JVM modules so that only one Kotlin version is on the classpath.
# junit   JUnit 6.1.3, the latest stable release on Maven Central at the time.
[versions]
agp = "9.5.1"
kotlin = "2.2.10"
junit = "6.1.3"

[libraries]
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
