# Versions are pinned to what the Phase 3 build was checked with (2026-11-08).
# Change them deliberately, then rebuild and re-test.
#
# agp     Android Gradle Plugin 9.5.1. Chosen because it supports API level 37, which the
#         Navigation SDK needs (Phase 4), and because it declares its own Kotlin: AGP 9 has
#         built-in Kotlin, so the app module does not apply a Kotlin plugin.
#         Requires Gradle 9.6.0 (see gradle/wrapper), JDK 17 or newer, Build Tools 36.0.0.
# kotlin  2.2.10: exactly the Kotlin Gradle plugin that AGP 9.5.1 depends on (read from its POM),
#         used for the two pure-JVM modules so that only one Kotlin version is on the classpath.
# junit   JUnit 6.1.3, the latest stable release on Maven Central at the time.
# navigation  Google Navigation SDK for Android 8.1.0 (latest on dl.google.com/dl/android/maven2 on
#         2026-11-08), used only by the :navsdk module. Its API was read from the AAR's class files.
# desugar The SDK requires core library desugaring in the app and in every module that depends on it
#         directly. Google's table for SDK 8.x lists desugar_jdk_libs_nio 2.1.5 with Gradle 9.1.0 and
#         AGP 9.0.1; this project uses newer Gradle and AGP (needed for API 37), which the build accepts.
[versions]
agp = "9.5.1"
kotlin = "2.2.10"
junit = "6.1.3"
navigation = "8.1.0"
desugar = "2.1.5"

[libraries]
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit" }
desugar-jdk-libs = { module = "com.android.tools:desugar_jdk_libs_nio", version.ref = "desugar" }
navigation-sdk = { module = "com.google.android.libraries.navigation:navigation", version.ref = "navigation" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
